<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gem Rush</title><style>body{margin:0;background:linear-gradient(135deg,#13002b,#001b3d);color:white;font-family:Arial;text-align:center}.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}h1{font-size:52px;color:#6ff;text-shadow:0 0 20px #0ff}button{padding:14px 28px;margin:8px;border:0;border-radius:15px;font-size:20px;font-weight:bold;background:#5c2cff;color:white}#game{display:none;padding:15px}.top{display:flex;justify-content:space-around;flex-wrap:wrap;font-size:18px;margin:12px}#board{width:min(92vw,520px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.gem{display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,38px);background:#ffffff18;border-radius:10px;user-select:none}.overlay{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}.card{background:#15153a;border:2px solid #6ff;border-radius:25px;padding:30px}</style></head><body><audio id="music" loop><source src="gem-rush-music.mp4" type="audio/mp4"></audio><div id="home" class="screen"><h1>💎 GEM RUSH</h1><button onclick="startGame()">PLAY</button><button onclick="alert('Levels 1–5')">LEVELS</button><button onclick="toggleMusic()">🎵 MUSIC ON/OFF</button></div><div id="game"><div class="top"><div>💎 Score: <b id="score">0</b></div><div>🎯 Target: <b id="target">300</b></div><div>❤️ Moves: <b id="moves">30</b></div><div>⭐ Level: <b id="level">1</b></div></div><button onclick="toggleMusic()">🎵 Music</button><div id="board"></div><button onclick="goHome()">🏠 Home</button></div><div id="overlay" class="overlay"><div class="card"><h2 id="msg"></h2><p id="sub"></p><button onclick="startGame()">REPLAY</button><button onclick="goHome()">HOME</button></div></div><script>
const E=["💎","🔴","🟢","🔵","🟣","🟡"],B=8,L=[{m:30,t:300},{m:28,t:650},{m:26,t:1050},{m:24,t:1500},{m:22,t:2100}];let a=[],sel=null,score=0,moves=0,level=1,lock=false,musicOn=false;const board=document.getElementById("board"),music=document.getElementById("music");
function startGame(){home.style.display="none";game.style.display="block";overlay.style.display="none";score=0;moves=L[level-1].m;update();a=[];for(let r=0;r<B;r++){a[r]=[];for(let c=0;c<B;c++){let x;do{x=Math.random()*6|0}while(c>1&&a[r][c-1]==x&&a[r][c-2]==x||r>1&&a[r-1][c]==x&&a[r-2][c]==x);a[r][c]=x}}draw();if(musicOn)music.play().catch(()=>{})}
function draw(){board.innerHTML="";for(let r=0;r<B;r++)for(let c=0;c<B;c++){let d=document.createElement("div");d.className="gem";d.textContent=E[a[r][c]];d.onclick=()=>tap(r,c);board.appendChild(d)}}
function matches(){let s=new Set();for(let r=0;r<B;r++){let st=0;for(let c=1;c<=B;c++){if(c<B&&a[r][c]==a[r][st])continue;if(c-st>=3)for(let k=st;k<c;k++)s.add(r*B+k);st=c}}for(let c=0;c<B;c++){let st=0;for(let r=1;r<=B;r++){if(r<B&&a[r][c]==a[st][c])continue;if(r-st>=3)for(let k=st;k<r;k++)s.add(k*B+c);st=r}}return s}
function tap(r,c){if(lock||moves<=0)return;if(!sel){sel=[r,c];return}let[sr,sc]=sel;sel=null;if(Math.abs(sr-r)+Math.abs(sc-c)!=1)return;[a[sr][sc],a[r][c]]=[a[r][c],a[sr][sc]];let m=matches();if(!m.size){[a[sr][sc],a[r][c]]=[a[r][c],a[sr][sc]];draw();return}moves--;lock=true;score+=m.size*10+(m.size>=4?m.size*5:0);m.forEach(i=>a[i/B|0][i%B]=null);for(let c=0;c<B;c++){let col=[];for(let r=B-1;r>=0;r--)if(a[r][c]!=null)col.push(a[r][c]);for(let r=B-1;r>=0;r--)a[r][c]=col[B-1-r]??(Math.random()*6|0)}draw();update();lock=false;let target=L[level-1].t;if(score>=target||moves<=0){msg.textContent=score>=target?"🎉 LEVEL COMPLETE!":"💥 TRY AGAIN";sub.textContent="Score: "+score;overlay.style.display="flex"}}
function update(){document.getElementById("score").textContent=score;document.getElementById("moves").textContent=moves;document.getElementById("level").textContent=level;document.getElementById("target").textContent=L[level-1].t}
function toggleMusic(){musicOn=!musicOn;if(musicOn)music.play().catch(()=>alert("PLAY दाबल्यानंतर Music सुरू होईल."));else music.pause()}
function goHome(){game.style.display="none";overlay.style.display="none";home.style.display="flex"}
</script></body></html>
