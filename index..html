<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem Rush</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #3b2a73, #15142c 65%, #0b0b18);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
  }
  .app {
    width: min(430px, 100%);
    min-height: 700px;
    border-radius: 28px;
    padding: 24px 18px;
    background: rgba(20, 18, 48, .94);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    text-align: center;
  }
  h1 {
    margin: 8px 0 4px;
    font-size: 48px;
    letter-spacing: 2px;
    background: linear-gradient(90deg,#7cf7ff,#d58cff,#ffd36e);
    -webkit-background-clip: text;
    color: transparent;
  }
  .tagline { opacity: .75; margin-bottom: 24px; }
  .screen { display: none; }
  .screen.active { display: block; }
  button {
    border: 0;
    border-radius: 16px;
    padding: 15px 28px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }
  .play {
    width: 90%;
    margin: 18px auto 10px;
    color: #16102c;
    background: linear-gradient(90deg,#7cf7ff,#d58cff);
  }
  .small {
    background: #29264e;
    color: white;
    margin: 7px;
    font-size: 15px;
    padding: 12px 18px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 10px 0 16px;
  }
  .stat {
    flex: 1;
    background: #29264e;
    border-radius: 14px;
    padding: 10px;
  }
  .stat b { display: block; font-size: 22px; margin-top: 3px; }
  #board {
    width: min(390px, 100%);
    aspect-ratio: 1;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    background: #0d0c20;
    padding: 7px;
    border-radius: 18px;
    touch-action: manipulation;
  }
  .gem {
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 7vw, 32px);
    user-select: none;
    box-shadow: inset 0 2px 5px rgba(255,255,255,.35), 0 3px 6px rgba(0,0,0,.3);
    transition: transform .12s;
  }
  .gem:active { transform: scale(.86); }
  .selected { outline: 3px solid white; transform: scale(.9); }
  .gem.blast { animation: gemBlast .35s ease-out forwards; }
  @keyframes gemBlast {
    0% { transform: scale(1); opacity: 1; }
    45% { transform: scale(1.28) rotate(8deg); opacity: 1; }
    100% { transform: scale(.1) rotate(30deg); opacity: 0; }
  }
  .combo {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%) scale(.7);
    font-size: 34px;
    font-weight: 900;
    color: white;
    text-shadow: 0 3px 16px rgba(0,0,0,.65);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }
  .combo.show { animation: comboPop .7s ease-out forwards; }
  .level-overlay {
    position: fixed;
    inset: 0;
    background: rgba(7, 6, 20, .78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 24px;
  }
  .level-card {
    width: min(360px, 100%);
    background: #201d46;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 26px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 20px 70px rgba(0,0,0,.5);
  }
  .level-card h2 { font-size: 34px; margin: 8px 0; }
  .level-card p { opacity: .82; font-size: 18px; }
  .next {
    width: 100%;
    margin-top: 12px;
    color: #16102c;
    background: linear-gradient(90deg,#7cf7ff,#d58cff);
  }
  .retry {
    width: 100%;
    margin-top: 10px;
    background: #302c59;
    color: white;
  }
  @keyframes comboPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
  }
  .message { min-height: 24px; margin: 10px; opacity: .8; }
  .back { margin-top: 14px; }
</style>
</head>
<body>
<div class="app">
  <div id="home" class="screen active">
    <div style="font-size:54px">💎</div>
    <h1>GEM RUSH</h1>
    <div class="tagline">Match. Blast. Rush!</div>
    <button class="play" onclick="startGame()">▶ PLAY</button><br>
    <button class="small" onclick="alert('Levels are coming in the next update!')">🏆 LEVELS</button>
    <button class="small" onclick="alert('Gem Rush V1')">⚙ SETTINGS</button>
  </div>

  <div id="levelOverlay" class="level-overlay">
    <div class="level-card">
      <div style="font-size:54px">🏆</div>
      <h2 id="overlayTitle">LEVEL COMPLETE!</h2>
      <p id="overlayText">Great job!</p>
      <button class="next" id="nextButton" onclick="nextLevel()">NEXT LEVEL ▶</button>
      <button class="retry" onclick="restartLevel()">↻ REPLAY LEVEL</button>
    </div>
  </div>

  <div id="game" class="screen">
    <h2>💎 GEM RUSH</h2>
    <div class="stats">
      <div class="stat">Score<b id="score">0</b></div>
      <div class="stat">Moves<b id="moves">30</b></div>
      <div class="stat">Level<b id="level">1</b></div>
    </div>
    <div class="message" id="target">Target: 300 points</div>
    <div id="board"></div>
    <div id="combo" class="combo"></div>
    <div id="message" class="message">Tap two adjacent gems to swap.</div>
    <button class="small back" onclick="showHome()">🏠 HOME</button>
  </div>
</div>

<script>
const SIZE = 8;
const gems = ["💎","🔷","🔶","🟣","🟢","🔴"];
const colors = ["#21c7ff","#3d7cff","#ff9d2e","#9b5cff","#35d06f","#ff4f68"];
let board = [], selected = null, score = 0, moves = 30, busy = false, comboCount = 0;
let level = 1;
let levelScore = 0;
let targetScore = 300;

function showHome() {
  document.getElementById("levelOverlay").style.display = "none";
  document.getElementById("game").classList.remove("active");
  document.getElementById("home").classList.add("active");
}
function startGame() {
  document.getElementById("home").classList.remove("active");
  document.getElementById("game").classList.add("active");
  level = 1;
  beginLevel();
}

function beginLevel() {
  const settings = [
  {moves: 30, target: 200},
  {moves: 28, target: 500},
  {moves: 26, target: 1000},
  {moves: 24, target: 1500},
  {moves: 22, target: 2000}
];
  const s = settings[Math.min(level - 1, settings.length - 1)];
  score = 0;
  levelScore = 0;
  moves = s.moves;
  targetScore = s.target;
  selected = null;
  comboCount = 0;
  busy = false;
  document.getElementById("score").textContent = score;
  document.getElementById("moves").textContent = moves;
  document.getElementById("level").textContent = level;
  document.getElementById("target").textContent = "Target: " + targetScore + " points";
  document.getElementById("message").textContent = "Tap two adjacent gems to swap.";
  document.getElementById("levelOverlay").style.display = "none";
  createBoard();
  render();
}

function nextLevel() {
  if (level >= 5) {
    level = 1;
    beginLevel();
    return;
  }
  level++;
  beginLevel();
}
 
function restartLevel() {
  beginLevel();
}
function randomGem() { return Math.floor(Math.random() * gems.length); }

function createBoard() {
  board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  for (let r=0;r<SIZE;r++) {
    for (let c=0;c<SIZE;c++) {
      let v;
      do {
        v = randomGem();
      } while (
        (c >= 2 && board[r][c-1] === v && board[r][c-2] === v) ||
        (r >= 2 && board[r-1][c] === v && board[r-2][c] === v)
      );
      board[r][c] = v;
    }
  }
}

function render() {
  const el = document.getElementById("board");
  el.innerHTML = "";
  for (let r=0;r<SIZE;r++) {
    for (let c=0;c<SIZE;c++) {
      const cell = document.createElement("div");
      cell.className = "gem" + (selected && selected.r===r && selected.c===c ? " selected" : "");
      cell.textContent = gems[board[r][c]];
      cell.style.background = colors[board[r][c]];
      cell.onclick = () => selectGem(r,c);
      el.appendChild(cell);
    }
  }
}

function adjacent(a,b) {
  return Math.abs(a.r-b.r)+Math.abs(a.c-b.c) === 1;
}
function selectGem(r,c) {
  if (busy || moves <= 0) return;
  if (!selected) {
    selected = {r,c};
    render();
    return;
  }
  if (!adjacent(selected,{r,c})) {
    selected = {r,c};
    render();
    return;
  }
  swap(selected,{r,c});
  selected = null;
}

function swap(a,b) {
  busy = true;
  [board[a.r][a.c], board[b.r][b.c]] = [board[b.r][b.c], board[a.r][a.c]];
  const matches = findMatches();
  if (!matches.length) {
    [board[a.r][a.c], board[b.r][b.c]] = [board[b.r][b.c], board[a.r][a.c]];
    document.getElementById("message").textContent = "No match — try another swap!";
    busy = false;
    render();
    return;
  }
  moves--;
  document.getElementById("moves").textContent = moves;
  clearMatches();
}

function findMatches() {
  const found = new Set();
  for (let r=0;r<SIZE;r++) {
    let start=0;
    for (let c=1;c<=SIZE;c++) {
      if (c<SIZE && board[r][c]===board[r][start]) continue;
      if (c-start>=3) for(let k=start;k<c;k++) found.add(r+","+k);
      start=c;
    }
  }
  for (let c=0;c<SIZE;c++) {
    let start=0;
    for (let r=1;r<=SIZE;r++) {
      if (r<SIZE && board[r][c]===board[start][c]) continue;
      if (r-start>=3) for(let k=start;k<r;k++) found.add(k+","+c);
      start=r;
    }
  }
  return [...found];
}

function showCombo(text) {
  const el = document.getElementById("combo");
  el.textContent = text;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}

function clearMatches() {
  let matches = findMatches();
  if (!matches.length) {
    comboCount = 0;
    busy = false;
    render();
    if (moves <= 0) {
      document.getElementById("message").textContent = "🎉 Game over! Final score: " + score;
    }
    return;
  }

  comboCount++;
  const bonus = Math.max(0, comboCount - 1) * 5;
  score += matches.length * 10 + bonus;
  levelScore = score;
  document.getElementById("score").textContent = score;

  if (score >= targetScore) {

  matches.forEach(key => {

    const [r,c] = key.split(",").map(Number);

    board[r][c] = -1;

  });

  render();

  busy = true;

  setTimeout(() => {

    showLevelComplete();

  }, 350);

  return;

}

  if (comboCount > 1) {
    showCombo("🔥 COMBO x" + comboCount + " +" + bonus);
  } else {
    showCombo("✨ BLAST!");
  }

  document.getElementById("message").textContent =
    matches.length >= 5 ? "💥 Mega match!" :
    matches.length >= 4 ? "⚡ Super match!" : "✨ Great match!";

  matches.forEach(key => {
    const [r,c] = key.split(",").map(Number);
    board[r][c] = -1;
  });

  render();

  // Show the blast animation on the matched cells before dropping new gems.
  matches.forEach(key => {
    const [r,c] = key.split(",").map(Number);
    const index = r * SIZE + c;
    const cell = document.getElementById("board").children[index];
    if (cell) cell.classList.add("blast");
  });

  setTimeout(() => {
    dropGems();
    render();
    setTimeout(clearMatches, 180);
  }, 280);
}

function showLevelComplete() {
  busy = true;

  const overlay = document.getElementById("levelOverlay");
  const nextButton = document.getElementById("nextButton");

  document.getElementById("overlayTitle").textContent =
    "LEVEL " + level + " COMPLETE! 🎉";

  document.getElementById("overlayText").textContent =
    "Score: " + score + " / Target: " + targetScore;

  nextButton.textContent =
    level >= 5 ? "PLAY AGAIN 🔄" : "NEXT LEVEL ▶";

  nextButton.onclick = function() {
    if (level >= 5) {
      level = 1;
    } else {
      level++;
    }

    beginLevel();
  };

  overlay.style.display = "flex";
}

function dropGems() {
  for (let c=0;c<SIZE;c++) {
    let col = [];
    for (let r=SIZE-1;r>=0;r--) if (board[r][c]!==-1) col.push(board[r][c]);
    while(col.length<SIZE) col.push(randomGem());
    for(let r=SIZE-1;r>=0;r--) board[r][c] = col[SIZE-1-r];
  }
}
</script>
</body>
</html>
